services:
  db:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: guard
  api:
    build: .
    ports:
      - "8000:8000"
  frontend:
    build: .
    command: streamlit run frontend/streamlit_app.py --server.port 8501 --server.enableCORS false
    ports:
      - "8501:8501"
